<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wayglow</title>
    <link rel="modulepreload" href="splash.js">
    <style>
    :root {
      color-scheme: dark;
    }
    body {
      margin: 0;
      width: 100dvw;
      height: 100dvh;
      overflow: hidden;
      display: grid;
      place-items: center;
      color: #f3ead6;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background:
        radial-gradient(
          circle at 50% 12%,
          rgba(255, 190, 92, 0.22),
          transparent 34%
        ),
        radial-gradient(
          circle at 46% 46%,
          rgba(255, 190, 92, 0.1),
          transparent 22%
        ),
        radial-gradient(
          circle at 56% 74%,
          rgba(255, 190, 92, 0.12),
          transparent 26%
        ),
        #0b1020;
    }
    main {
      display: grid;
      gap: 14px;
      justify-items: center;
      text-align: center;
      padding: 0 24px;
      max-width: 420px;
    }
    h1 {
      margin: 0;
      font:
        600 44px / 1 Georgia,
        'Times New Roman',
        serif;
      letter-spacing: 0.04em;
      color: #ffd98a;
    }
    p {
      margin: 0;
      font-size: 16px;
      line-height: 1.45;
      color: #d8cfbb;
    }
    #stats {
      font-size: 14px;
      color: #a9b3d1;
      min-height: 20px;
    }
    button {
      margin-top: 6px;
      border: 0;
      border-radius: 999px;
      padding: 14px 26px;
      font:
        600 17px system-ui,
        sans-serif;
      color: #1c1405;
      background: #ffc45c;
      cursor: pointer;
    }
    button:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 3px;
    }
    </style>
  </head>
  <body>
    <main>
      <h1>Wayglow</h1>
      <p>
        One dark valley. Three lanterns. Every step you take stays lit for the
        walkers after you.
      </p>
      <p id="stats" aria-live="polite"></p>
      <button id="start-btn" type="button">Walk tonight's valley</button>
    </main>
    <script src="splash.js" type="module"></script>
  </body>
</html>
