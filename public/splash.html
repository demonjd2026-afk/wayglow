<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wayglow</title>
    <link
      rel="preload"
      href="fonts/fraunces.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    >
    <link rel="stylesheet" href="ui.css">
    <link rel="modulepreload" href="splash.js">
    <style>
    body {
      display: grid;
      place-items: center;
    }
    main {
      display: grid;
      gap: 12px;
      justify-items: center;
      text-align: center;
      padding: 0 22px;
      max-width: 430px;
    }
    h1 {
      margin: 0;
      font-size: clamp(44px, 15vw, 64px);
      line-height: 1;
    }
    h1 span {
      display: inline-block;
    }
    #mini {
      width: min(250px, 64vw);
      aspect-ratio: 7 / 3;
    }
    p {
      margin: 0;
      font-size: 16px;
      line-height: 1.45;
      color: #d9d2c2;
      max-width: 30ch;
    }
    #stats {
      font-size: 13px;
      color: var(--mist);
      min-height: 18px;
    }
    .btn {
      margin-top: 4px;
      padding: 15px 28px;
      font-size: 17px;
    }
    </style>
  </head>
  <body>
    <canvas id="backdrop" aria-hidden="true"></canvas>
    <main>
      <canvas id="mini" aria-hidden="true"></canvas>
      <h1 class="wordmark" aria-label="Wayglow"></h1>
      <p>
        One dark valley. Three lanterns. Every step you take stays lit for the
        walkers after you.
      </p>
      <p id="stats" aria-live="polite"></p>
      <button id="start-btn" class="btn" type="button">
        Walk tonight's valley
      </button>
    </main>
    <script src="splash.js" type="module"></script>
  </body>
</html>
