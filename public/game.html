<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta
      name="viewport"
      content="width=device-width, maximum-scale=1, minimum-scale=1, user-scalable=no"
    >
    <title>Wayglow</title>
    <link rel="modulepreload" href="game.js">
    <style>
    :root {
      color-scheme: dark;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      width: 100dvw;
      height: 100dvh;
      overflow: hidden;
      display: grid;
      grid-template-rows: auto 1fr auto;
      background: #0b1020;
      color: #f3ead6;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      -webkit-user-select: none;
      user-select: none;
      touch-action: none;
    }
    header,
    footer {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
    }
    header {
      justify-content: space-between;
      font-size: 14px;
      color: #a9b3d1;
    }
    #title {
      font:
        600 18px Georgia,
        serif;
      color: #ffd98a;
      letter-spacing: 0.04em;
    }
    #lanterns {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    #lanterns i {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #ffc45c;
      box-shadow: 0 0 10px #ffb23e;
    }
    #lanterns i.out {
      background: transparent;
      box-shadow: none;
      border: 2px solid #3a4468;
    }
    #stage {
      position: relative;
      min-height: 0;
    }
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    footer {
      justify-content: space-between;
      height: 92px;
    }
    #hint {
      font-size: 14px;
      line-height: 1.35;
      color: #d8cfbb;
      flex: 1;
      max-height: 76px;
      overflow: hidden;
    }
    button {
      border: 0;
      border-radius: 999px;
      padding: 12px 20px;
      cursor: pointer;
      font:
        600 16px system-ui,
        sans-serif;
      color: #1c1405;
      background: #ffc45c;
      white-space: nowrap;
    }
    button.quiet {
      background: transparent;
      color: #d8cfbb;
      border: 1px solid #3a4468;
    }
    button:disabled {
      opacity: 0.4;
      cursor: default;
    }
    button:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 2px;
    }
    #card {
      position: absolute;
      inset: 0;
      display: none;
      place-items: center;
      padding: 16px;
      background: rgba(11, 16, 32, 0.82);
    }
    #card.show {
      display: grid;
    }
    #card section {
      width: min(360px, 100%);
      max-height: 100%;
      overflow: auto;
      padding: 20px;
      border-radius: 16px;
      background: #141b33;
      border: 1px solid #2b3560;
      display: grid;
      gap: 12px;
    }
    #card h2 {
      margin: 0;
      font:
        600 24px Georgia,
        serif;
      color: #ffd98a;
    }
    #card p {
      margin: 0;
      font-size: 14px;
      line-height: 1.4;
      color: #d8cfbb;
    }
    #card dl {
      margin: 0;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 6px 12px;
      font-size: 15px;
    }
    #card dt {
      color: #a9b3d1;
    }
    #card dd {
      margin: 0;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    #card .total {
      font-weight: 700;
      color: #ffd98a;
      border-top: 1px solid #2b3560;
      padding-top: 6px;
    }
    #card ol {
      margin: 0;
      padding-left: 22px;
      font-size: 14px;
      color: #d8cfbb;
    }
    </style>
  </head>
  <body>
    <header>
      <span id="title">Wayglow</span>
      <span id="where"></span>
      <span id="lanterns" role="img" aria-label="3 lanterns left"
        ><i></i><i></i><i></i></span
      >
    </header>
    <div id="stage">
      <canvas id="valley" aria-label="Tonight's valley"></canvas>
      <div
        id="card"
        role="dialog"
        aria-modal="true"
        aria-labelledby="card-title"
      >
        <section>
          <h2 id="card-title">Tonight</h2>
          <p id="card-sub"></p>
          <dl id="card-score"></dl>
          <p id="card-streak"></p>
          <ol id="card-board"></ol>
          <p id="card-next"></p>
          <button id="card-close" type="button">See the valley</button>
        </section>
      </div>
    </div>
    <footer>
      <span id="hint" aria-live="polite">Lighting the lanterns…</span>
      <button id="undo-btn" class="quiet" type="button" disabled>Clear</button>
      <button id="walk-btn" type="button" disabled>Walk</button>
    </footer>
    <script src="game.js" type="module"></script>
  </body>
</html>
