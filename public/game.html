<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta
      name="viewport"
      content="width=device-width, maximum-scale=1, minimum-scale=1, user-scalable=no"
    >
    <title>Wayglow</title>
    <link
      rel="preload"
      href="fonts/fraunces.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    >
    <link rel="stylesheet" href="ui.css">
    <link rel="modulepreload" href="game.js">
    <style>
    body {
      display: grid;
      grid-template-rows: auto 1fr auto;
      -webkit-user-select: none;
      user-select: none;
      touch-action: none;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px 6px;
    }
    header .wordmark {
      font-size: 22px;
    }
    #where {
      font-size: 13px;
      color: var(--mist);
      text-align: center;
      flex: 1;
    }
    #lanterns {
      display: flex;
      gap: 7px;
      align-items: center;
    }
    #lanterns i {
      width: 13px;
      height: 17px;
      border-radius: 5px 5px 7px 7px;
      background: linear-gradient(180deg, var(--wick), var(--ember));
      box-shadow:
        0 0 12px rgba(255, 170, 60, 0.9),
        0 -3px 0 -1px #6b5527;
      transition:
        background 0.5s,
        box-shadow 0.5s,
        transform 0.5s;
    }
    #lanterns i.out {
      background: #1a2248;
      box-shadow:
        inset 0 0 0 1.5px #39447a,
        0 -3px 0 -1px #2a3360;
      transform: translateY(2px);
    }
    #stage {
      position: relative;
      min-height: 0;
    }
    #valley {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    footer {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px 14px;
      height: 92px;
    }
    #hint {
      font-size: 14px;
      line-height: 1.35;
      color: #d9d2c2;
      flex: 1;
      max-height: 76px;
      overflow: hidden;
    }
    #loader {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
    }
    .orb {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        var(--wick) 0 18%,
        var(--ember) 34%,
        rgba(255, 150, 40, 0) 70%
      );
      animation: breathe 1.5s ease-in-out infinite;
    }
    #card {
      position: absolute;
      inset: 0;
      display: none;
      place-items: center;
      padding: 16px;
      background: rgba(5, 8, 20, 0.45);
    }
    #card.show {
      display: grid;
    }
    #card section {
      width: min(350px, 100%);
      max-height: 100%;
      overflow: auto;
      padding: 22px 20px 18px;
      border-radius: 22px;
      display: grid;
      gap: 12px;
    }
    #card h2 {
      margin: 0;
      font: 560 27px / 1.1 var(--display);
      color: var(--wick);
      text-shadow: 0 0 20px rgba(255, 181, 71, 0.5);
    }
    #card p {
      margin: 0;
      font-size: 14px;
      line-height: 1.4;
      color: #d9d2c2;
    }
    #card dl {
      margin: 0;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 7px 12px;
      font-size: 15px;
    }
    #card dt {
      color: var(--mist);
    }
    #card dd {
      margin: 0;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    #card .total {
      font: 600 22px var(--display);
      color: var(--ember);
      border-top: 1px solid rgba(160, 175, 255, 0.2);
      padding-top: 8px;
    }
    #card ol {
      margin: 0;
      padding-left: 22px;
      font-size: 14px;
      color: #d9d2c2;
    }
    #card ol:empty {
      display: none;
    }
    </style>
    <style>
    body {
      grid-template-rows: auto auto 1fr auto;
    }
    #where {
      flex: 0 1 auto;
      text-align: left;
    }
    #valley:focus-visible {
      outline: 2px solid rgba(255, 255, 255, 0.5);
      outline-offset: -2px;
    }
    header .wordmark {
      flex: 1;
    }
    .chip {
      border: 0;
      border-radius: 999px;
      padding: 6px 10px;
      font: 600 11px var(--ui);
      color: var(--mist);
      background: rgba(160, 175, 255, 0.1);
      cursor: pointer;
    }
    .chip[aria-pressed='false'] {
      opacity: 0.6;
    }
    .chip:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 2px;
    }
    #sub {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 16px 6px;
      min-height: 26px;
    }
    #faces {
      display: flex;
    }
    .face {
      position: relative;
      width: 22px;
      height: 22px;
      margin-right: -6px;
      border-radius: 50%;
      overflow: hidden;
      display: grid;
      place-items: center;
      font: 700 11px var(--ui);
      color: #241503;
      background: var(--ember);
      box-shadow: 0 0 0 2px var(--night);
    }
    .face img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: var(--marsh);
    }
    #faces:not(:empty) {
      margin-right: 8px;
    }
    #toast {
      position: absolute;
      left: 50%;
      top: 8px;
      transform: translateX(-50%);
      max-width: calc(100% - 32px);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 13px;
      color: var(--wick);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
      display: none;
    }
    #toast.show {
      display: block;
    }
    #card-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      align-items: end;
    }
    #card-stats div {
      display: grid;
      gap: 4px;
      justify-items: stretch;
      align-items: end;
      font-size: 11px;
      color: var(--mist);
      text-align: center;
    }
    #card-stats i {
      border-radius: 5px 5px 2px 2px;
      background: rgba(160, 175, 255, 0.28);
    }
    #card-stats .mine i {
      background: linear-gradient(180deg, var(--wick), var(--ember));
    }
    #card-stats .mine {
      color: var(--wick);
    }
    </style>
    <style>
    #card {
      padding: 10px;
    }
    #card section {
      gap: 9px;
      padding: 18px 18px 16px;
    }
    #card h2 {
      font-size: 24px;
    }
    #card p,
    #card ol {
      font-size: 13px;
    }
    #card dl {
      font-size: 14px;
      gap: 4px 12px;
    }
    #card .total {
      font-size: 20px;
      padding-top: 6px;
    }
    #card .btn {
      padding: 11px 20px;
    }
    </style>
  </head>
  <body>
    <canvas id="backdrop" aria-hidden="true"></canvas>
    <header>
      <span class="wordmark">Wayglow</span>
      <button id="sound-btn" class="chip" type="button" aria-pressed="true">
        Sound on
      </button>
      <span id="lanterns" role="img" aria-label="3 lanterns left"
        ><i></i><i></i><i></i></span
      >
    </header>
    <div id="sub"><span id="faces"></span><span id="where"></span></div>
    <div id="stage">
      <canvas id="valley" aria-label="Tonight's valley" tabindex="0"></canvas>
      <div id="loader"><div class="orb"></div></div>
      <div id="toast" class="glass" role="status"></div>
      <div
        id="card"
        role="dialog"
        aria-modal="true"
        aria-labelledby="card-title"
      >
        <section class="glass beam">
          <h2 id="card-title">Tonight</h2>
          <p id="card-sub"></p>
          <dl id="card-score"></dl>
          <p id="card-guided"></p>
          <div
            id="card-stats"
            role="img"
            aria-label="How tonight's walkers finished"
          ></div>
          <p id="card-streak"></p>
          <ol id="card-board"></ol>
          <button id="flair-btn" class="btn quiet" type="button" hidden>
            Wear my streak as flair
          </button>
          <button id="card-close" class="btn" type="button">
            See the valley
          </button>
        </section>
      </div>
    </div>
    <footer>
      <span id="hint" aria-live="polite">Lighting the lanterns</span>
      <button id="undo-btn" class="btn quiet" type="button" disabled>
        Clear
      </button>
      <button id="walk-btn" class="btn" type="button" disabled>Walk</button>
    </footer>
    <script src="game.js" type="module"></script>
  </body>
</html>
